# PostgreSQL 16 + pgvector (CHARTER.md §7, ADR-009). 로컬 전용.
# 사용: cp .env.example .env && docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: deleted-code-search-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcs}
      POSTGRES_DB: ${POSTGRES_DB:-deleted_code_search}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcs} -d ${POSTGRES_DB:-deleted_code_search}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 통계 대시보드 API (#93). 저장소를 그대로 마운트해 docs/reports/dashboard_stats.json 을 읽는다.
  # 사용: docker compose up api  /  전체 테스트: docker compose run --rm api pytest
  # 검색(#8)에서 db 와 같이 쓴다.
  api:
    image: python:3.12-slim
    container_name: deleted-code-search-api
    working_dir: /app
    # 설치 뒤 command 를 실행한다 - `docker compose run --rm api pytest` 도 설치부터 한다
    entrypoint: ["sh", "-c", "pip install -q -e '.[dev,web]' && exec \"$$@\"", "--"]
    command: ["uvicorn", "search.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      # 호스트(Windows)의 .venv·egg-info 가 컨테이너 설치와 섞이지 않게 가린다
      - /app/.venv
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  pip-cache:
  pgdata:
